<script>
const btnHandler = ($btn) => {
	if($btn.attr('data-run') === '') {
		$btn.attr('data-run', 'started').removeClass('ux-button-primary').addClass('ux-button-details').empty().text('Reload Tests').prop('disabled',true);
		startQUnit();
		setTimeout(() => { $btn.prop('disabled',false); }, 1250);
	} else {
		self.location = self.location;
	};
};
</script>
<div style="padding-top:7px; padding-bottom:10px; text-align:center;"><h2 style="display:inline;">[###MAIN|html###]</h2><span id="btn-area-run-tests"> &nbsp; <button id="btn-run-tests" type="button" class="ux-button ux-button-primary" style="width:200px;" data-run="" onclick="const $btn = jQuery(this); btnHandler($btn);"><i class="sfi sfi-gear-alt"></i> Run Tests</button></span></div><hr>
<div id="qunit"><div style="text-align:center; cursor:help;" title="SmartQUnit"><img src="lib/js-qunit/qunit/img/logo.svg" width="128" height="128"></div><hr></div>
<div id="qunit-fixture"></div>
<div id="smart-qunit-results">[[###APP-REALM|html###]] // QUnit Running: [###TIME-DATE-START|html###]<br><img src="lib/framework/img/loading-cylon.svg" width="24" height="24"></div>
<script>
jQuery('#smart-qunit-results').hide();
const $btnArea = jQuery('span#btn-area-run-tests');
var smartQUnitStartDelay = [###AUTORUN-DELAY-MSEC|int###]; // default is 500 ; qunit start delay (if many tests are loader async by ajax calls this time should be increased, ex: 2500)
if(smartQUnitStartDelay < 0) {
	smartQUnitStartDelay = 0
} else if(smartQUnitStartDelay > 0) {
	$btnArea.hide();
} //end if
var smartQUnitDisabledTests = 0; // init (use it later to register the number of disabled tests)
var smartQUnitDoneCounter = 0;
QUnit.config.uxmAllowRerun = true; // this is the default behaviour
QUnit.config.uxmUniqueModules = true; // force unique module (names) ; using nested modules with this set to TRUE may produce unexpected behaviour
QUnit.config.urlConfig = [{ id: 'hidepassed', label: 'Display only Errors', tooltip: 'Show only Errors, Hide Passed' }];
QUnit.config.storage = null; // do not use browser storage
QUnit.config.autostart = false; // do not start testing (yet)
QUnit.config.reorder = false; // if TRUE, QUnit will run tests first that failed on a previous run
QUnit.config.testTimeout = [###TIMEOUT-EXECUTION-SEC|int###] * 1000; // max time per test ; specify a global timeout in milliseconds after which all tests will fail with an appropriate message
if(QUnit.config.testTimeout < 1000) {
	QUnit.config.testTimeout = 1000;
} //end if
QUnit.done((details) => { // done handler (more done handlers can be set later)
	smartQUnitDoneCounter++;
	jQuery('#smart-qunit-results').empty().text('[[###APP-REALM|js###]] QUnit DONE (#' + smartQUnitDoneCounter + '). Disabled: ' + parseInt(smartQUnitDisabledTests) + '\n' + 'Total: ' + details.total + ' ; Failed: ' + details.failed + ' ; Passed: ' + details.passed + ' ; RunTime: ' + Math.ceil(details.runtime / 1000) + 's');
	jQuery('#smart-qunit-done').empty().html('<h1 id="qunit-footer">#&nbsp;END&nbsp;#&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[###FOOTER|html###]</h1><hr><div style="text-align:right; opacity:0.15;"><small>SmartQUnit :: &copy; 2026-present unix-world.org</small></div>');
});
const startQUnit = () => {
	jQuery('#smart-qunit-results').show();
	setTimeout(() => { QUnit.start(); }, 100);
};
</script>
<script>
[###ASIDE###]
</script>
<script>
jQuery(() => {
	if(smartQUnitStartDelay > 0) {
		setTimeout(() => {
			$btnArea.show();
			const $btn = jQuery('button#btn-run-tests');
			btnHandler($btn);
		}, Math.ceil(smartQUnitStartDelay));
	}
});
</script>
<div id="smart-qunit-done"></div>
