	<script>
	const runPage = () => {
		const elm = document.getElementById('info');
		if(!elm) {
			console.warn('Target Element `info` not found by ID');
			return;
		}
		const matches = document.querySelectorAll('i');
		if(!matches) {
			console.warn('No Target Elements found for type `i`');
			return;
		}
		matches.forEach((el, idx) => {
			const cls = String(el.getAttribute('class') || '').trim();
			if(cls == '') {
				console.warn('Failed to get CSS Class for glyph #', (idx + 1));
				return;
			}
			el.setAttribute('title', String('glyph #' + (idx + 1) + ': `' + cls + '`'));
			const newDiv = document.createElement('div');
			newDiv.innerText = cls
			el.parentNode.appendChild(newDiv);
			el.onclick = function(e) {
				const txt = 'html code sample to use the selected glyph: `<i class="' + cls + '"></i>`';
				try {
					elm.innerText = String(txt);
				} catch(e) {
					console.error(e);
					console.log(txt, cls);
				}
			}
		});
	};
	runPage();
	</script>
